# Compila il salvaschermo IcoNVader per macOS (universale arm64 + x86_64).
# Avvio manuale: Actions → "Compila salvaschermo macOS" → Run workflow.
#
# Tre job separati:
#   build   compila e collauda; usa strumenti esterni (XcodeGen da Homebrew) ma NON vede alcun secret
#   sign    firma, notarizza e ricollauda il bundle; unico job con i secret, usa solo strumenti di
#           Apple preinstallati e azioni actions/* mantenute da GitHub
#   release pubblica la release; unico job con permesso di scrittura sul repository
name: Compila salvaschermo macOS

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Pubblica anche una release GitHub con lo zip"
        type: boolean
        default: false
      tag:
        description: "Tag della release (es. v3.0.1); usato solo se release è attivo"
        type: string
        default: ""
      notes:
        description: "Novità della release (Markdown, in inglese); usato solo se release è attivo"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Versioni degli strumenti
        run: |
          sw_vers
          xcodebuild -version
          swift --version
          node --version

      - name: Traduzioni aggiornate
        run: python3 tools/genera_traduzioni.py --verifica

      - name: Collaudo del nucleo (Swift = versione web)
        run: macos/Tests/compare.sh 600

      - name: Genera il progetto Xcode
        run: |
          brew install xcodegen
          cd macos && xcodegen generate

      - name: Compila
        run: |
          mkdir -p build
          xcodebuild \
            -project macos/IcoNVader.xcodeproj \
            -target IcoNVader \
            -configuration Release \
            SYMROOT="$PWD/build" \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual \
            build > build/xcodebuild.log 2>&1 || { tail -100 build/xcodebuild.log; exit 1; }
          grep -E "(warning|error):" build/xcodebuild.log | sort -u || true
          tail -3 build/xcodebuild.log

      - name: Verifica il bundle
        run: |
          SAVER=build/Release/IcoNVader.saver
          ls -R "$SAVER" | head -40
          lipo -info "$SAVER/Contents/MacOS/IcoNVader"
          plutil -p "$SAVER/Contents/Info.plist"
          codesign --verify --deep --verbose=2 "$SAVER"
          ls "$SAVER/Contents/Resources/Icon Sets/Christmas" "$SAVER/Contents/Resources/Icon Sets/Daedale"

      - name: Collaudo del bundle (caricamento, animazione, screenshot)
        run: |
          swiftc -o build/render macos/Tests/render.swift
          build/render build/Release/IcoNVader.saver build/screenshot

      - name: Prepara il bundle per il job di firma
        run: |
          cd build/Release
          ditto -c -k --sequesterRsrc --keepParent IcoNVader.saver ../IcoNVader-adhoc.zip

      - uses: actions/upload-artifact@v4
        with:
          name: bundle-adhoc
          path: build/IcoNVader-adhoc.zip
          retention-days: 1

      - uses: actions/upload-artifact@v4
        with:
          name: screenshot
          path: build/screenshot

  sign:
    needs: build
    runs-on: macos-15
    outputs:
      signing: ${{ steps.esito.outputs.signing }}
    env:
      # Firma Developer ID e notarizzazione partono solo se i secret sono configurati
      # (vedi docs/firma-macos.md). Senza secret il bundle resta con la firma ad-hoc.
      HAS_CERT: ${{ secrets.MACOS_CERT_P12_BASE64 != '' && secrets.MACOS_CERT_PASSWORD != '' }}
      HAS_NOTARY: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 != '' && secrets.APP_STORE_CONNECT_KEY_ID != '' && secrets.APP_STORE_CONNECT_ISSUER_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: bundle-adhoc
          path: build

      - name: Estrae il bundle
        run: |
          ditto -x -k build/IcoNVader-adhoc.zip build/Release
          rm build/IcoNVader-adhoc.zip
          codesign --verify --verbose=2 build/Release/IcoNVader.saver

      - name: Firma con Developer ID
        if: env.HAS_CERT == 'true'
        env:
          P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          SAVER=build/Release/IcoNVader.saver
          KEYCHAIN="$RUNNER_TEMP/firma.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/certificato.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/certificato.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/certificato.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | grep 'Developer ID Application' | head -1 | awk -F'"' '{print $2}')"
          if [ -z "$IDENTITY" ]; then
            echo "::error::Il file .p12 non contiene un certificato 'Developer ID Application' con la sua chiave privata."
            exit 1
          fi
          echo "Firma con: $IDENTITY"
          codesign --force --timestamp --options runtime --sign "$IDENTITY" "$SAVER"
          codesign --verify --strict --verbose=2 "$SAVER"
          codesign -dv --verbose=2 "$SAVER" 2>&1 | grep -E "Authority|TeamIdentifier|Runtime|flags" || true

      - name: Notarizzazione e staple
        if: env.HAS_CERT == 'true' && env.HAS_NOTARY == 'true'
        env:
          NOTARY_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          NOTARY_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          NOTARY_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          SAVER=build/Release/IcoNVader.saver
          KEY="$RUNNER_TEMP/AuthKey.p8"
          echo "$NOTARY_API_KEY" | base64 --decode > "$KEY"
          ditto -c -k --keepParent "$SAVER" "$RUNNER_TEMP/da-notarizzare.zip"
          xcrun notarytool submit "$RUNNER_TEMP/da-notarizzare.zip" \
            --key "$KEY" --key-id "$NOTARY_API_KEY_ID" --issuer "$NOTARY_API_ISSUER_ID" \
            --wait --timeout 30m --output-format json > "$RUNNER_TEMP/notarizzazione.json" || true
          cat "$RUNNER_TEMP/notarizzazione.json"
          STATUS="$(plutil -extract status raw -o - "$RUNNER_TEMP/notarizzazione.json" 2>/dev/null || echo sconosciuto)"
          ID="$(plutil -extract id raw -o - "$RUNNER_TEMP/notarizzazione.json" 2>/dev/null || true)"
          if [ "$STATUS" != "Accepted" ]; then
            echo "::error::Notarizzazione non riuscita (stato: $STATUS)."
            [ -n "$ID" ] && xcrun notarytool log "$ID" --key "$KEY" --key-id "$NOTARY_API_KEY_ID" --issuer "$NOTARY_API_ISSUER_ID" || true
            rm -f "$KEY"
            exit 1
          fi
          rm -f "$KEY"
          xcrun stapler staple "$SAVER"
          xcrun stapler validate "$SAVER"
          spctl --assess --type install --verbose=4 "$SAVER" || echo "(spctl non valuta i bundle .saver come installabili: controllo solo informativo)"

      - name: Rimuove il portachiavi temporaneo
        if: always() && env.HAS_CERT == 'true'
        run: security delete-keychain "$RUNNER_TEMP/firma.keychain-db" || true

      - name: Collaudo del bundle finale
        run: |
          swiftc -o "$RUNNER_TEMP/render" macos/Tests/render.swift
          "$RUNNER_TEMP/render" build/Release/IcoNVader.saver "$RUNNER_TEMP/screenshot"

      - name: Prepara lo zip
        id: esito
        run: |
          if [ "$HAS_CERT" = "true" ] && [ "$HAS_NOTARY" = "true" ]; then
            echo "signing=notarized" >> "$GITHUB_OUTPUT"
          elif [ "$HAS_CERT" = "true" ]; then
            echo "signing=signed" >> "$GITHUB_OUTPUT"
          else
            echo "signing=adhoc" >> "$GITHUB_OUTPUT"
          fi
          cd build/Release
          ditto -c -k --sequesterRsrc --keepParent IcoNVader.saver ../IcoNVader-saver.zip

      - uses: actions/upload-artifact@v4
        with:
          name: IcoNVader-saver
          path: build/IcoNVader-saver.zip

  release:
    needs: sign
    if: ${{ inputs.release }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: IcoNVader-saver
          path: dist

      - name: Pubblica la release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          NOTES: ${{ inputs.notes }}
          SIGNING_STATE: ${{ needs.sign.outputs.signing }}
        run: |
          TAG="${TAG:-v3.0.1-build${GITHUB_RUN_NUMBER}}"
          case "$SIGNING_STATE" in
            notarized) SIGNING="Signed with a Developer ID and notarized by Apple: install it with a double-click." ;;
            signed)    SIGNING="Signed with a Developer ID but not notarized: the first time, allow it in System Settings → Privacy & Security." ;;
            *)         SIGNING="Ad-hoc signed and not notarized: remove the quarantine flag before installing (see the README)." ;;
          esac
          # Note in inglese: novità passate dall'input "notes" + parte fissa
          {
            if [ -n "$NOTES" ]; then printf '%s\n\n' "$NOTES"; fi
            echo "## Download"
            echo
            echo "\`IcoNVader-saver.zip\` — the rebuilt IcoNVader screen saver, universal (Apple Silicon + Intel), macOS 11 or later."
            echo
            echo "**Signature:** $SIGNING"
            echo
            echo "**Updating from a previous version:** after installing, quit System Settings and run \`killall legacyScreenSaver\`, otherwise macOS keeps the old version loaded."
            echo
            echo "Unofficial rebuild, not affiliated with Daedale. IcoNVader 3.0 © 2004-2006 Daedale."
          } > "$RUNNER_TEMP/release-notes.md"
          cat "$RUNNER_TEMP/release-notes.md"
          gh release create "$TAG" dist/IcoNVader-saver.zip \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "IcoNVader for macOS ($TAG)" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
