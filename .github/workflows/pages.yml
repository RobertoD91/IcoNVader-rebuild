# Pubblica la versione web di IcoNVader su GitHub Pages.
# Parte a ogni push su main che modifica web/, oppure a mano da Actions → "Pubblica su Pages".
# Requisito una tantum: Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Pubblica su Pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/iconvader
      - id: deployment
        uses: actions/deploy-pages@v4
