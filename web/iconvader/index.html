<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IcoNVader</title>
  <style>
    :root {
      --panel-bg: rgba(236, 236, 236, 0.97);
      --panel-fg: #1d1d1f;
      --panel-muted: #6e6e73;
      --panel-line: rgba(0, 0, 0, 0.16);
      --tab-bg: rgba(0, 0, 0, 0.05);
      --field-bg: #ffffff;
      --accent: #2f6fdf;
      --link: #2f6fdf;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --panel-bg: rgba(40, 40, 44, 0.96);
        --panel-fg: #ececf0;
        --panel-muted: #a0a0aa;
        --panel-line: rgba(255, 255, 255, 0.16);
        --tab-bg: rgba(255, 255, 255, 0.06);
        --field-bg: rgba(255, 255, 255, 0.08);
        --accent: #4f8cff;
        --link: #6ea2ff;
        color-scheme: dark;
      }
    }
    :root[data-theme="dark"] {
      --panel-bg: rgba(40, 40, 44, 0.96);
      --panel-fg: #ececf0;
      --panel-muted: #a0a0aa;
      --panel-line: rgba(255, 255, 255, 0.16);
      --tab-bg: rgba(255, 255, 255, 0.06);
      --field-bg: rgba(255, 255, 255, 0.08);
      --accent: #4f8cff;
      --link: #6ea2ff;
      color-scheme: dark;
    }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
    body { font: 13px/1.35 -apple-system, BlinkMacSystemFont, "Lucida Grande", "Helvetica Neue", Helvetica, Arial, sans-serif; }
    canvas { display: block; position: fixed; inset: 0; }
    body.idle, body.idle * { cursor: none; }

    #hint {
      position: fixed; left: 16px; bottom: 16px; padding: 6px 10px; border-radius: 6px;
      background: rgba(0, 0, 0, 0.55); color: #c8c8d0; font-size: 12px;
      transition: opacity .6s; pointer-events: none;
    }
    body.idle #hint { opacity: 0; }

    #toggle {
      position: fixed; top: 16px; right: 16px; width: 40px; height: 40px; border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.2); background: rgba(0, 0, 0, 0.55); color: #ececf0;
      font-size: 20px; cursor: pointer; transition: opacity .6s;
    }
    body.idle #toggle { opacity: 0; }

    /* Pannello opzioni: stessa struttura dell'originale (schede Aspetto, Animazione, Avanzate) */
    #panel {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: min(456px, calc(100vw - 32px)); max-height: calc(100vh - 32px); overflow: auto;
      box-sizing: border-box; padding: 14px 13px 12px; color: var(--panel-fg);
      background: var(--panel-bg); border: 1px solid var(--panel-line); border-radius: 10px;
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    }
    #panel[hidden] { display: none; }
    #panel h1 { margin: 0 0 10px; font-size: 13px; font-weight: 600; text-align: center; }

    .tabs { display: flex; justify-content: center; margin-bottom: -11px; position: relative; z-index: 1; }
    .tabs button {
      font: inherit; color: var(--panel-fg); padding: 3px 14px; cursor: pointer;
      background: var(--field-bg); border: 1px solid var(--panel-line); margin-left: -1px;
    }
    .tabs button:first-child { border-radius: 6px 0 0 6px; margin-left: 0; }
    .tabs button:last-child { border-radius: 0 6px 6px 0; }
    .tabs button[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
    .tabbox {
      border: 1px solid var(--panel-line); border-radius: 8px; background: var(--tab-bg);
      padding: 24px 16px 14px; min-height: 268px; box-sizing: border-box;
    }
    .tabbox section[hidden] { display: none; }

    .row { display: grid; grid-template-columns: minmax(110px, 38%) 1fr; align-items: center; gap: 6px 10px; margin: 10px 0 14px; }
    .row > label, .row > .lbl { text-align: right; }
    .slider { display: grid; grid-template-columns: 1fr 1fr; }
    .slider input { grid-column: 1 / -1; width: 100%; margin: 0; accent-color: var(--accent); }
    .slider .min, .slider .max { font-size: 11px; color: var(--panel-muted); }
    .slider .max { text-align: right; }
    select, input[type=color] {
      font: inherit; color: var(--panel-fg); background: var(--field-bg);
      border: 1px solid var(--panel-line); border-radius: 5px; padding: 3px 6px; max-width: 100%;
    }
    select:disabled { opacity: 0.5; }
    input[type=color] { width: 44px; height: 26px; padding: 1px 2px; }
    .strip {
      display: flex; gap: 6px; overflow-x: auto; padding: 4px 6px; margin: 4px 0 10px;
      background: var(--field-bg); border: 1px solid var(--panel-line); border-radius: 4px;
    }
    .strip img { width: 64px; height: 64px; flex: none; }
    .credit { margin: 22px 0 0; text-align: center; font-size: 10px; color: var(--panel-muted); }
    .credit a { color: var(--link); }
    .buttons { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; }
    .buttons button {
      font: inherit; padding: 4px 18px; border-radius: 6px; cursor: pointer; color: var(--panel-fg);
      background: var(--field-bg); border: 1px solid var(--panel-line); min-width: 74px;
    }
    .buttons button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }

    @media (max-width: 420px) {
      .row { grid-template-columns: 1fr; }
      .row > label, .row > .lbl { text-align: left; }
    }
  </style>
</head>
<body>
  <canvas id="screen" aria-label="IcoNVader"></canvas>
  <div id="hint"></div>
  <button id="toggle" type="button" aria-controls="panel" aria-expanded="false">⚙︎</button>

  <form id="panel" hidden>
    <h1>IcoNVader</h1>
    <div class="tabs" role="tablist">
      <button type="button" role="tab" id="tab-appearance" aria-controls="sec-appearance" aria-selected="true" data-i18n="tab.appearance"></button>
      <button type="button" role="tab" id="tab-animation" aria-controls="sec-animation" aria-selected="false" data-i18n="tab.animation"></button>
      <button type="button" role="tab" id="tab-advanced" aria-controls="sec-advanced" aria-selected="false" data-i18n="tab.advanced"></button>
    </div>
    <div class="tabbox">
      <section id="sec-appearance" role="tabpanel" aria-labelledby="tab-appearance">
        <div class="row">
          <label for="iconSet" data-i18n="label.icons"></label>
          <select id="iconSet" name="iconSet"></select>
        </div>
        <div class="strip" id="iconPreview"></div>
        <div class="row">
          <label for="scaleFactor" data-i18n="label.iconSize"></label>
          <div class="slider">
            <input id="scaleFactor" name="scaleFactor" type="range" min="0.1" max="1" step="0.01">
            <span class="min" data-i18n="end.small"></span><span class="max" data-i18n="end.large"></span>
          </div>
        </div>
        <div class="row">
          <label for="backgroundColor" data-i18n="label.background"></label>
          <div><input id="backgroundColor" name="backgroundColor" type="color"></div>
        </div>
      </section>

      <section id="sec-animation" role="tabpanel" aria-labelledby="tab-animation" hidden>
        <div class="row">
          <label for="density" data-i18n="label.invasion"></label>
          <div class="slider">
            <input id="density" name="density" type="range" min="0" max="100" step="1">
            <span class="min" data-i18n="end.scattered"></span><span class="max" data-i18n="end.rampant"></span>
          </div>
        </div>
        <div class="row">
          <label for="lifeExpectancy" data-i18n="label.life"></label>
          <div class="slider">
            <input id="lifeExpectancy" name="lifeExpectancy" type="range" min="100" max="5000" step="1">
            <span class="min" data-i18n="end.bornDead"></span><span class="max" data-i18n="end.ancient"></span>
          </div>
        </div>
        <div class="row">
          <label for="animationSpeed" data-i18n="label.speed"></label>
          <div class="slider">
            <input id="animationSpeed" name="animationSpeed" type="range" min="10" max="60" step="1">
            <span class="min" data-i18n="end.slow"></span><span class="max" data-i18n="end.fast"></span>
          </div>
        </div>
        <div class="row">
          <label for="behavior" data-i18n="label.behavior"></label>
          <div><select id="behavior" name="behavior"></select></div>
        </div>
        <div class="row">
          <label for="randomBehaviorChangeInterval" data-i18n="label.randomEvery"></label>
          <div><select id="randomBehaviorChangeInterval" name="randomBehaviorChangeInterval"></select></div>
        </div>
      </section>

      <section id="sec-advanced" role="tabpanel" aria-labelledby="tab-advanced" hidden>
        <div class="row">
          <label for="renderer" data-i18n="label.renderer"></label>
          <div><select id="renderer" disabled><option data-i18n="web.canvas"></option></select></div>
        </div>
        <div class="row">
          <label for="language" data-i18n="label.language"></label>
          <div>
            <select id="language" name="language">
              <option value="auto" data-i18n="language.auto"></option>
              <option value="en">English</option>
              <option value="fr">Français</option>
              <option value="it">Italiano</option>
            </select>
          </div>
        </div>
        <p class="credit">
          <span data-i18n="credit.original"></span><br>
          <span data-i18n="credit.rebuild"></span><br>
          <a href="https://github.com/RobertoD91/IcoNVader-rebuild" target="_blank" rel="noopener">github.com/RobertoD91/IcoNVader-rebuild</a>
        </p>
      </section>
    </div>

    <div class="buttons">
      <button type="button" id="cancel" data-i18n="button.cancel"></button>
      <button type="submit" class="primary" data-i18n="button.ok"></button>
    </div>
  </form>

  <script src="js/i18n.js"></script>
  <script src="js/core.js"></script>
  <script src="js/behaviors/comets.js"></script>
  <script src="js/behaviors/fireworks.js"></script>
  <script src="js/behaviors/gameoflife.js"></script>
  <script src="js/behaviors/hypnosis.js"></script>
  <script src="js/behaviors/dna.js"></script>
  <script src="js/behaviors/jumpers.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
